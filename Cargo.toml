[package]
name = "fdmon"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.30.0"
crossterm = "0.29.0"
anyhow = "1.0.100"
nix = { version = "0.31.1", features = ["signal", "user"] }
clap = { version = "4.5.57", features = ["derive"] }
uzers = "0.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
chrono = { version = "0.4.43", features = ["serde"] }
