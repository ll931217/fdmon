name: CI

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo test --verbose

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy -- -D warnings

  build:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: fdmon
            asset_name: fdmon-linux-x86_64

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: fdmon
            asset_name: fdmon-linux-aarch64

          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: fdmon
            asset_name: fdmon-darwin-x86_64

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: fdmon
            asset_name: fdmon-darwin-aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Strip binary
        if: matrix.os != 'windows-latest'
        run: strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            asset_name=$(basename "$dir")
            cp "$dir"fdmon "release/$asset_name"
            chmod +x "release/$asset_name"
          done
          ls -lh release/

      - name: Extract version from tag
        id: version
        env:
          REF_NAME: ${{ github.ref }}
        run: echo "VERSION=${REF_NAME#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Generate release notes
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          cat > release_notes.md << 'EOF'
          ## fdmon v${{ steps.version.outputs.VERSION }}

          ### Installation

          **Linux (x86_64):**
          ```bash
          curl -fsSL https://github.com/ll931217/fdmon/releases/download/v${{ steps.version.outputs.VERSION }}/fdmon-linux-x86_64 -o fdmon
          chmod +x fdmon
          sudo mv fdmon /usr/local/bin/
          ```

          **Linux (ARM64):**
          ```bash
          curl -fsSL https://github.com/ll931217/fdmon/releases/download/v${{ steps.version.outputs.VERSION }}/fdmon-linux-aarch64 -o fdmon
          chmod +x fdmon
          sudo mv fdmon /usr/local/bin/
          ```

          **macOS (Intel):**
          ```bash
          curl -fsSL https://github.com/ll931217/fdmon/releases/download/v${{ steps.version.outputs.VERSION }}/fdmon-darwin-x86_64 -o fdmon
          chmod +x fdmon
          sudo mv fdmon /usr/local/bin/
          ```

          **macOS (Apple Silicon):**
          ```bash
          curl -fsSL https://github.com/ll931217/fdmon/releases/download/v${{ steps.version.outputs.VERSION }}/fdmon-darwin-aarch64 -o fdmon
          chmod +x fdmon
          sudo mv fdmon /usr/local/bin/
          ```

          **Or use the install script:**
          ```bash
          curl -fsSL https://raw.githubusercontent.com/ll931217/fdmon/master/install.sh | bash
          ```

          ### Changes

          See [CHANGELOG.md](https://github.com/ll931217/fdmon/blob/master/CHANGELOG.md) for details.
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: release_notes.md
          files: release/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
